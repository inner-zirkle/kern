name: Docs

# The site reads docs/llms.md, so a path filter of docs/site/** alone lets a
# change to the overview ship a stale llms.txt. The default branch is main;
# it was master until the rename, and the stale trigger froze the published
# site for three weeks without failing anything.
on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - docs/llms.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/site/**
      - docs/llms.md
      - .github/workflows/docs.yml
  workflow_dispatch:

# Pages on this repo is configured build_type=workflow, which serves the
# artifact uploaded by actions/deploy-pages and ignores any branch. The old job
# pushed a built tree to gh-pages instead, so every deploy since 2026-07-16 was
# a no-op that reported success: the branch moved, the site did not. Publishing
# through the official actions is what makes the green check mean something.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for the one live site; queue instead of cancelling,
# so a superseded build still finishes rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /kern
      # Next emits _next/; without this Jekyll drops every underscore path.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          # Resolved from the workspace root: `defaults.run` only steers `run`.
          path: docs/site/out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
