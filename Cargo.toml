[workspace]
resolver = "2"
members = ["src/util", "src/base", "src/math", "src/store", "src/store_core", "src/bootstrap", "src/graph", "src/ingest_config", "src/llm", "src/config", "src/gnn", "src/retrieval", "src/ingest", "src/tick", "src/gossip", "src/tick_loop", "src/test_support", "src/transport", "src/transport/macros", "src/health", "src/mcp", "src/rpc"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# HELD at 2: bincode bytes ARE the persisted store format — a major bump
# changes encoding, which is a FORMAT_VERSION wipe, not a routine update.
bincode = { version = "2", features = ["serde"] }
sha2 = "0.11"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
axum = "0.8.9"
rayon = "1.12"
transport-macros = { path = "src/transport/macros" }
toml = "1"
parking_lot = "0.12"
util = { path = "src/util" }
base = { path = "src/base" }
math = { path = "src/math" }
store = { path = "src/store" }
graph = { path = "src/graph" }
ingest_config = { path = "src/ingest_config" }
llm = { path = "src/llm" }
config = { path = "src/config" }
gnn = { path = "src/gnn" }
retrieval = { path = "src/retrieval" }
ingest = { path = "src/ingest" }
tick = { path = "src/tick" }
gossip = { path = "src/gossip" }
transport = { path = "src/transport" }
tick_loop = { path = "src/tick_loop" }
test_support = { path = "src/test_support" }
health = { path = "src/health" }
store_core = { path = "src/store_core" }
mcp = { path = "src/mcp" }
rpc = { path = "src/rpc" }
bootstrap = { path = "src/bootstrap" }

[workspace.lints.rust]
warnings = "deny"
dead_code = "warn"
unused_imports = "warn"

[package]
name = "kern"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]

[lib]
path = "src/lib.rs"

[[bin]]
name = "kern"
path = "src/main.rs"


[dependencies]
dirs = "6"
toml.workspace = true
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
rand.workspace = true
bincode.workspace = true
thiserror.workspace = true
rayon.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2.workspace = true
axum.workspace = true
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tracing-subscriber.workspace = true
tracing.workspace = true
notify = "8"
ignore = "0.4"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
# HELD at 0.20: 0.22 breaks the external-commit reconcile path
# (a_link_racing_an_external_commit_keeps_both — "from thought not found");
# env/read-txn snapshot semantics changed. Bumping needs a store-layer pass.
heed = "0.20"
transport-macros = { path = "src/transport/macros" }
anyhow.workspace = true
zstd = "0.13"
parking_lot.workspace = true
ed25519-dalek = "3"
blake3 = "1"
chacha20poly1305 = "0.11"
util = { path = "src/util" }
base = { path = "src/base" }
math = { path = "src/math" }
store = { path = "src/store" }
store_core = { path = "src/store_core" }
mcp = { path = "src/mcp" }
rpc = { path = "src/rpc" }
bootstrap = { path = "src/bootstrap" }
graph = { path = "src/graph" }
ingest_config = { path = "src/ingest_config" }
llm = { path = "src/llm" }
config = { path = "src/config" }
gnn = { path = "src/gnn" }
retrieval = { path = "src/retrieval" }
ingest = { path = "src/ingest" }
tick = { path = "src/tick" }
gossip = { path = "src/gossip" }
tick_loop = { path = "src/tick_loop" }
transport = { path = "src/transport" }
test_support = { path = "src/test_support" }
health = { path = "src/health" }

# Unix socket ownership: std exposes the owner of a *file* but never the
# identity of this process — `geteuid` spells whose socket it is.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows named-pipe ACLs: a pipe has no mode bits, so owner-only is a security
# descriptor, spelled via windows-sys.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
parking_lot.workspace = true
# `start_paused`: the pre-auth deadline is five seconds of real patience, and a
# test that waits it out is a test nobody runs.
tokio = { workspace = true, features = ["test-util"] }
test_support = { path = "src/test_support" }

[lints]
workspace = true
