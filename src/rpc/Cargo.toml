[package]
name = "rpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base = { path = "../base" }
config = { path = "../config" }
ingest = { path = "../ingest" }
llm = { path = "../llm" }
mcp = { path = "../mcp" }
gossip = { path = "../gossip" }
tick = { path = "../tick" }
tick_loop = { path = "../tick_loop" }
transport = { path = "../transport" }
util = { path = "../util" }
test_support = { path = "../test_support" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
# `start_paused`: the pre-auth deadline is five seconds of real patience. The
# workspace build only compiled because the root package's dev-dep unified the
# feature in — `cargo test -p rpc` alone needs it declared here.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
